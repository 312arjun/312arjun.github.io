/* =========================================================
   RESET + TOKENS (aligned with about/contact)
========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0c0d0f;
  --panel: rgba(18, 21, 26, .72);
  --panel-solid: #14171c;
  --panel-2: rgba(26, 30, 36, .72);
  --text: #f2f2f0;
  --muted: #8a9099;
  --muted-2: #626873;
  --amber: #ff9f00;
  --amber-bright: #ffb13b;
  --border: rgba(255,255,255,.09);
  --blue: #4da3ff;
  --green: #4ade80;
  --purple: #a78bfa;
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(255,159,0,.07), transparent 55%),
    radial-gradient(ellipse 60% 40% at 85% 90%, rgba(77,163,255,.04), transparent 50%),
    radial-gradient(ellipse 50% 35% at 10% 80%, rgba(167,139,250,.035), transparent 50%);
  display: flex;
  flex-direction: column;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .025;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

a { color: inherit; text-decoration: none; }

/* =========================================================
   NAV — matches index/about/contact
========================================================= */
.navbar {
  position: relative;
  z-index: 10;
  height: 72px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.05);
  background: linear-gradient(180deg, rgba(12,13,15,.55), rgba(12,13,15,.15));
  backdrop-filter: blur(8px);
  width: 100%;
}

.logo {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: #f5f5f3;
  text-decoration: none;
}
.logo .slash { color: var(--amber); }

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}
.nav-links a {
  position: relative;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-decoration: none;
  color: #aeb2ba;
  padding: 26px 2px 18px;
  transition: color .2s ease;
}
.nav-links a:hover { color: var(--amber-bright); }
.nav-links a.active { color: var(--amber); }
.nav-links a.active::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 14px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  transform: translateX(-50%);
  background: var(--amber);
  box-shadow: 0 0 8px rgba(255,159,0,.85);
}
.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 10px;
  width: 100%;
  min-width: 28px;
  height: 2px;
  transform: translateX(-50%);
  background: var(--amber);
  box-shadow: 0 0 10px rgba(255,159,0,.7);
}

/* =========================================================
   LAYOUT
========================================================= */
main {
  position: relative;
  z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 32px 40px;
  width: 100%;
  flex: 1;
}

.section-tag {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 14px;
}

.page-headline {
  font-size: clamp(34px, 4vw, 48px);
  line-height: 1.08;
  letter-spacing: -1.4px;
  font-weight: 750;
  color: #f4f4f2;
  margin-bottom: 18px;
}
.page-headline .accent { color: var(--amber); }

.intro-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px 48px;
  margin-bottom: 28px;
  max-width: 980px;
}
.intro-row p {
  color: #9aa0aa;
  font-size: 14.5px;
  line-height: 1.65;
}

/* =========================================================
   FILTER + SEARCH
========================================================= */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  appearance: none;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(22, 26, 32, .72);
  color: #b8bcc4;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .6px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.pill:hover {
  color: #f0f1f3;
  border-color: rgba(255,159,0,.35);
}
.pill.active {
  background: var(--amber);
  color: #14110a;
  border-color: var(--amber);
  font-weight: 700;
  box-shadow: 0 0 18px rgba(255,159,0,.35);
}

.search-wrap {
  position: relative;
  flex: 0 1 260px;
  min-width: 200px;
}
.search-wrap .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--muted-2);
  pointer-events: none;
}
.search-wrap .search-icon svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.search-wrap input {
  width: 100%;
  height: 38px;
  padding: 0 14px 0 36px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(12, 14, 18, .72);
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.search-wrap input::placeholder { color: var(--muted-2); }
.search-wrap input:focus {
  border-color: rgba(255,159,0,.45);
  box-shadow: 0 0 0 3px rgba(255,159,0,.12);
}

/* =========================================================
   PROJECT GRID + CARDS
========================================================= */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.project-card {
  display: flex;
  gap: 14px;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(14px);
  transition: border-color .2s ease, background .2s ease, transform .15s ease, box-shadow .2s ease;
  min-height: 148px;
}
.project-card:hover {
  border-color: rgba(255,159,0,.28);
  background: rgba(22, 26, 32, .88);
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,.35);
}
.project-card[hidden] { display: none !important; }

.jewel {
  flex-shrink: 0;
  width: 78px;
  height: 92px;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.12);
  background: #0e1014;
  box-shadow:
    0 0 0 1px rgba(255,159,0,.08) inset,
    0 8px 22px rgba(0,0,0,.45),
    0 0 24px rgba(255,159,0,.12);
  display: grid;
  place-items: center;
}
.jewel img.cd-art {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.jewel.has-art .jewel-bg,
.jewel.has-art svg.icon {
  display: none;
}
.jewel.has-art::before {
  opacity: .35;
}
.jewel::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,.14), transparent 42%, rgba(0,0,0,.25));
  pointer-events: none;
  z-index: 1;
}
.jewel .jewel-bg {
  position: absolute;
  inset: 0;
  opacity: 1;
}
.jewel svg.icon {
  position: relative;
  z-index: 2;
  width: 30px;
  height: 30px;
  fill: none;
  stroke: #f5f5f3;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.45));
}
.jewel[data-tone="amber"] .jewel-bg {
  background: linear-gradient(145deg, #3a2a12 0%, #1a140c 55%, #0e0c0a 100%);
}
.jewel[data-tone="blue"] .jewel-bg {
  background: linear-gradient(145deg, #16324a 0%, #0f1822 55%, #0c1016 100%);
}
.jewel[data-tone="green"] .jewel-bg {
  background: linear-gradient(145deg, #163a28 0%, #0f1a14 55%, #0c1210 100%);
}
.jewel[data-tone="purple"] .jewel-bg {
  background: linear-gradient(145deg, #2a1f44 0%, #16121f 55%, #0e0c14 100%);
}
.jewel[data-tone="slate"] .jewel-bg {
  background: linear-gradient(145deg, #2a3038 0%, #15191e 55%, #0e1014 100%);
}

.card-body {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-cat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .8px;
  color: var(--muted);
  text-transform: uppercase;
}
.card-cat .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px rgba(255,159,0,.85);
  flex-shrink: 0;
}

.card-title {
  font-size: 14.5px;
  font-weight: 650;
  color: #f2f2f0;
  line-height: 1.25;
  letter-spacing: -.2px;
}

.card-desc {
  font-size: 12.5px;
  line-height: 1.5;
  color: #8e949e;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  margin-top: auto;
  padding-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tech-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.tech-tag {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .3px;
  color: #b4b8c0;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 999px;
  padding: 3px 8px;
}

.card-links {
  display: flex;
  gap: 8px;
}
.card-links a {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(12,14,18,.5);
  display: grid;
  place-items: center;
  color: #c8ccd4;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.card-links a:hover {
  color: var(--amber);
  border-color: rgba(255,159,0,.4);
  background: rgba(255,159,0,.08);
}
.card-links a svg {
  width: 14px;
  height: 14px;
}
.card-links a .fill { fill: currentColor; }
.card-links a .stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
  font-size: 14px;
  border: 1px dashed rgba(255,255,255,.1);
  border-radius: 16px;
  background: rgba(18,21,26,.4);
}
.empty-state[hidden] { display: none !important; }

footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 8px 20px 16px;
  color: var(--muted-2);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 1180px) {
  .projects-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .projects-grid { grid-template-columns: repeat(2, 1fr); }
  .intro-row { grid-template-columns: 1fr; gap: 12px; }
}
@media (max-width: 720px) {
  .navbar { padding: 0 16px; height: 52px; }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 10px; padding: 16px 2px 12px; }
  main { padding: 16px 16px 28px; }
  .projects-grid { grid-template-columns: 1fr; }
  .search-wrap { flex: 1 1 100%; }
  .page-headline { font-size: 30px; }
}
@media (max-width: 420px) {
  .jewel { width: 64px; height: 64px; }
}
</style>

  payment: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/>',
  desktop: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  chip: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3"/>',
  docker: '<path d="M4 14h3v3H4zM8 14h3v3H8zM12 14h3v3h-3zM8 10h3v3H8zM12 10h3v3h-3z"/><path d="M3 18c2 2 5 3 9 3s7-1 9-3c-1-3-3-5-5-6"/>',
  tools: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5 2.5-2.5z"/>',
  cloud: '<path d="M18 18H7a4 4 0 0 1-.3-8A6 6 0 0 1 18.5 12 3.5 3.5 0 0 1 18 18z"/>',
  car: '<path d="M4 14l1.5-4.5A2 2 0 0 1 7.4 8h9.2a2 2 0 0 1 1.9 1.5L20 14"/><path d="M3 14h18v3a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1v-3z"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>',
};

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.title = PROJECTS_PAGE.pageTitle || "Arjun Soundarajan — Projects";
document.getElementById("pageTag").textContent = PROJECTS_PAGE.tag;
document.getElementById("pageHeadline").innerHTML =
  escapeHtml(PROJECTS_PAGE.headlineBefore || "") +
  '<span class="accent">' + escapeHtml(PROJECTS_PAGE.headlineAccent || "") + "</span>";
document.getElementById("introLeft").textContent = PROJECTS_PAGE.introLeft || "";
document.getElementById("introRight").textContent = PROJECTS_PAGE.introRight || "";
document.getElementById("footerText").textContent =
  (PROJECTS_PAGE.brand || "Arjun") + " // PROJECTS";

const pillsEl = document.getElementById("filterPills");
const gridEl = document.getElementById("projectsGrid");
const emptyEl = document.getElementById("emptyState");
const searchEl = document.getElementById("searchInput");

let activeFilter = "All";
let searchQuery = "";

(PROJECTS_PAGE.filters || ["All"]).forEach((name, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pill" + (i === 0 ? " active" : "");
  btn.textContent = name;
  btn.setAttribute("role", "tab");
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.addEventListener("click", () => {
    activeFilter = name;
    pillsEl.querySelectorAll(".pill").forEach((p) => {
      const on = p.textContent === name;
      p.classList.toggle("active", on);
      p.setAttribute("aria-selected", on ? "true" : "false");
    });
    applyFilters();
  });
  pillsEl.appendChild(btn);
});

function jewelIcon(key) {
  return ICONS[key] || ICONS.code;
}

function cardHtml(p) {
  const tags = (p.tags || [])
    .map((t) => `<span class="tech-tag">${escapeHtml(t)}</span>`)
    .join("");
  const gh = p.github || "#";
  const link = p.link || "#";
  return `
  <article class="project-card" data-filter="${escapeHtml(p.filter || "")}" data-search="${escapeHtml(
    [p.title, p.description, p.category, ...(p.tags || [])].join(" ").toLowerCase()
  )}">
    <div class="jewel${p.image ? " has-art" : ""}" data-tone="${escapeHtml(p.tone || "slate")}" aria-hidden="true">
      <div class="jewel-bg"></div>
      ${p.image
        ? `<img class="cd-art" src="${escapeHtml(p.image)}" alt="" loading="lazy" />`
        : `<svg class="icon" viewBox="0 0 24 24">${jewelIcon(p.icon)}</svg>`}
    </div>
    <div class="card-body">
      <div class="card-cat"><span class="dot"></span><span>${escapeHtml(p.category || "")}</span></div>
      <h2 class="card-title">${escapeHtml(p.title || "")}</h2>
      <p class="card-desc">${escapeHtml(p.description || "")}</p>
      <div class="card-footer">
        <div class="tech-tags">${tags}</div>
        <div class="card-links">
          <a href="${escapeHtml(gh)}" ${gh !== "#" ? 'target="_blank" rel="noopener"' : ""} aria-label="GitHub" title="GitHub">
            <svg class="fill" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <a href="${escapeHtml(link)}" ${link !== "#" ? 'target="_blank" rel="noopener"' : ""} aria-label="Open project" title="Open project">
            <svg class="stroke" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M10 14L20 4"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
      </div>
    </div>
  </article>`;
}

gridEl.innerHTML = PROJECTS.map(cardHtml).join("");

function applyFilters() {
  const q = searchQuery.trim().toLowerCase();
  let visible = 0;
  gridEl.querySelectorAll(".project-card").forEach((card) => {
    const f = card.getAttribute("data-filter") || "";
    const hay = card.getAttribute("data-search") || "";
    const okFilter = activeFilter === "All" || f === activeFilter;
    const okSearch = !q || hay.includes(q);
    const show = okFilter && okSearch;
    card.hidden = !show;
    if (show) visible++;
  });
  emptyEl.hidden = visible > 0;
}

searchEl.addEventListener("input", () => {
  searchQuery = searchEl.value || "";
  applyFilters();
});

applyFilters();
</script>
</body>
</html>
