<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjun Soundarajan — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/contact.css">
</head>
<body>

<nav class="navbar">
  <a class="logo" href="index.html" id="brandLogo">Arjun <span class="slash">//</span></a>
  <ul class="nav-links">
    <li><a href="index.html#work">WORK</a></li>
    <li><a href="about.html">ABOUT</a></li>
    <li><a href="projects.html">PROJECTS</a></li>
    <li><a href="contact.html" class="active">CONTACT</a></li>
  </ul>
</nav>

<main>
  <div class="contact-grid">
    <!-- ========== LEFT ========== -->
    <section class="left-col" aria-label="Contact info">
      <div class="section-tag" id="contactTag">04. CONTACT</div>
      <h1 id="contactHeadline">Let's Build Something <span class="accent">Amazing.</span></h1>
      <p class="bio" id="contactBio"></p>

      <div class="info-grid" id="infoGrid">
        <div class="info-card">
          <div class="info-icon email" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Email</div>
            <a class="value" id="infoEmail" href="#"></a>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon location" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-5.33-7-11a7 7 0 1 1 14 0c0 5.67-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Location</div>
            <div class="value" id="infoLocation"></div>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon timezone" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Timezone</div>
            <div class="value" id="infoTimezone"></div>
          </div>
        </div>
      </div>

      <div class="social-row" id="socialRow" aria-label="Social links">
        <a class="social-btn" id="socialGithub" href="#" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a class="social-btn" id="socialLinkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zM8.5 8.5h3.8v2h.05c.53-1 1.82-2.05 3.75-2.05 4.01 0 4.75 2.64 4.75 6.07V23h-4v-6.6c0-1.57-.03-3.59-2.19-3.59-2.19 0-2.53 1.71-2.53 3.48V23h-4V8.5z"/></svg>
        </a>
        <a class="social-btn" id="socialTwitter" href="#" target="_blank" rel="noopener" aria-label="X / Twitter" title="X / Twitter">
          <svg viewBox="0 0 24 24"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.563l-5.14-6.71L5.25 22H2l8.03-9.17L1.5 2h6.72l4.64 6.15L18.244 2zm-1.15 18h1.82L7.01 3.9H5.06L17.094 20z"/></svg>
        </a>
        <a class="social-btn stroke-icon" id="socialEmail" href="#" aria-label="Email" title="Email">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        </a>
      </div>
    </section>

    <!-- ========== RIGHT — FORM ========== -->
    <aside class="form-card" aria-label="Send a message">
      <div class="form-title"><span class="dot" aria-hidden="true"></span><span id="formTitle">Send a Message</span></div>
      <p class="form-helper" id="formHelper"></p>

      <form id="contactForm" novalidate>
        <div class="field" id="fieldName">
          <label for="name">Name <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg></span>
            <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
          </div>
        </div>
        <div class="field" id="fieldEmail">
          <label for="email">Email <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg></span>
            <input type="email" id="email" name="email" placeholder="your.email@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="field" id="fieldSubject">
          <label for="subject">Subject <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></span>
            <input type="text" id="subject" name="subject" placeholder="Project discussion, Job opportunity, etc." required>
          </div>
        </div>
        <div class="field" id="fieldMessage">
          <label for="message">Message <span class="req">*</span></label>
          <div class="input-wrap textarea-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>
        </div>

        <button type="submit" class="btn-send" id="sendBtn">Send Message →</button>
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      </form>

      <div class="or-divider">OR</div>

      <div class="alt-actions">
        <a class="alt-btn" id="altGithub" href="#" target="_blank" rel="noopener">
          <span class="alt-left">
            <svg class="fill-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            View GitHub
          </span>
          <span class="arrow">→</span>
        </a>
        <a class="alt-btn" id="altLinkedin" href="#" target="_blank" rel="noopener">
          <span class="alt-left">
            <svg class="fill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zM8.5 8.5h3.8v2h.05c.53-1 1.82-2.05 3.75-2.05 4.01 0 4.75 2.64 4.75 6.07V23h-4v-6.6c0-1.57-.03-3.59-2.19-3.59-2.19 0-2.53 1.71-2.53 3.48V23h-4V8.5z"/></svg>
            Connect on LinkedIn
          </span>
          <span class="arrow">→</span>
        </a>
        <a class="alt-btn" id="altEmail" href="#">
          <span class="alt-left">
            <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
            Email Me
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </aside>
  </div>
</main>

<footer id="footerText">Arjun // CONTACT</footer>

<script src="js/contact.js"></script>
</body>
</html>
