<body>

<nav class="navbar">
  <a class="logo" href="#" id="brandLogo">Arjun <span class="slash">//</span></a>
  <ul class="nav-links">
    <li><a href="#work" class="active">WORK</a></li>
    <li><a href="about.html">ABOUT</a></li>

<main>
  <section class="hero" id="work">
    <div class="eyebrow" id="heroEyebrow">Arjun // WORKING SET</div>
    <h1 id="heroHeadline">Things I've built for <span class="accent">my desk.</span></h1>
    <p id="heroSub">Software, automation, IoT and experiments — collected like a shelf of CDs.</p>
  </section>

  <section class="shelf-section" aria-label="Project turntable shelf">
    <div class="turntable-scene" id="turntableScene">
      <button class="arrow prev" id="prev" aria-label="Previous project" type="button">‹</button>
      <button class="arrow next" id="next" aria-label="Next project" type="button">›</button>

      <img class="tray" id="tray" src="assets/backgrounds/shelf.png" alt="" draggable="false">
      <div class="cd-stage" id="cdStage"></div>
    </div>

    <div class="shelf-caption">
      <span id="counter">01</span> &nbsp;/&nbsp; <span id="total">00</span> PROJECTS
      &nbsp;//&nbsp; DRAG TO SPIN · CLICK A CD
    </div>
  </section>

  <section class="project-panel" id="projectPanel" aria-live="polite">
    <div class="preview" id="previewWrap">
      <img id="projectPreviewImg" src="" alt="">
      <div class="preview-overlay" id="previewOverlay"></div>
    </div>

    <div class="project-main">
      <div class="project-title"><h2 id="projectTitle"></h2></div>
      <div class="project-subtitle" id="projectSubtitle"></div>
      <p class="project-description" id="projectDescription"></p>
      <div class="tags" id="projectTags"></div>
      <div class="buttons">
        <a href="#" class="btn btn-primary" id="projectLink" target="_blank" rel="noopener">View project&nbsp;→</a>
        <a href="#" class="btn btn-github" id="projectGithub" target="_blank" rel="noopener" aria-label="GitHub">

        </a>
      </div>
    </div>

    <div class="features" id="projectFeatures"></div>
  </section>


</main>

<footer>Arjun Soundarajan</footer>

<script src="js/index.js"></script>
</body>
</html>
