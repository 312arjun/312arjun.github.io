<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjun Soundarajan — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   RESET + TOKENS (aligned with index/about)
========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0c0d0f;
  --panel: rgba(18, 21, 26, .78);
  --panel-solid: #14171c;
  --panel-2: rgba(26, 30, 36, .72);
  --text: #f2f2f0;
  --muted: #8a9099;
  --muted-2: #626873;
  --amber: #ff9f00;
  --amber-bright: #ffb13b;
  --border: rgba(255,255,255,.09);
  --blue: #4da3ff;
  --green: #4ade80;
  --input-bg: rgba(12, 14, 18, .72);
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
  background-color: var(--bg);
  background-image: url("assets/backgrounds/contact_bg.png");
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
}

/* Full-viewport dark gradient overlay over desk art */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(180deg, rgba(8,9,11,.78) 0%, rgba(8,9,11,.48) 28%, rgba(8,9,11,.38) 55%, rgba(8,9,11,.72) 100%),
    linear-gradient(90deg, rgba(8,9,11,.22) 0%, rgba(8,9,11,.12) 42%, rgba(8,9,11,.55) 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .025;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

a { color: inherit; text-decoration: none; }

/* =========================================================
   NAV — matches index/about
========================================================= */
.navbar {
  position: relative;
  z-index: 10;
  height: 72px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.05);
  background: linear-gradient(180deg, rgba(12,13,15,.55), rgba(12,13,15,.15));
  backdrop-filter: blur(8px);
  width: 100%;
}

.logo {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: #f5f5f3;
  text-decoration: none;
}
.logo .slash { color: var(--amber); }

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}
.nav-links a {
  position: relative;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-decoration: none;
  color: #aeb2ba;
  padding: 26px 2px 18px;
  transition: color .2s ease;
}
.nav-links a:hover { color: var(--amber-bright); }
.nav-links a.active { color: var(--amber); }
.nav-links a.active::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 14px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  transform: translateX(-50%);
  background: var(--amber);
  box-shadow: 0 0 8px rgba(255,159,0,.85);
}
.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 10px;
  width: 100%;
  min-width: 28px;
  height: 2px;
  transform: translateX(-50%);
  background: var(--amber);
  box-shadow: 0 0 10px rgba(255,159,0,.7);
}

/* =========================================================
   LAYOUT
========================================================= */
main {
  position: relative;
  z-index: 1;
  max-width: 1280px; /* match .navbar title bar width */
  margin: 0 auto;
  padding: 28px 32px 32px;
  width: 100%;
  flex: 1;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 36px;
  align-items: start;
}

.section-tag {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 14px;
}

.left-col h1 {
  font-size: clamp(32px, 3.6vw, 46px);
  line-height: 1.1;
  letter-spacing: -1.2px;
  font-weight: 750;
  color: #f4f4f2;
  margin-bottom: 16px;
  text-shadow: 0 2px 22px rgba(0,0,0,.55);
}
.left-col h1 .accent { color: var(--amber); }

.left-col .bio {
  color: #9aa0aa;
  font-size: 14.5px;
  line-height: 1.65;
  max-width: 480px;
  margin-bottom: 28px;
}

/* =========================================================
   INFO CARDS (Email | Location / Timezone)
========================================================= */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
  max-width: 520px;
}

.info-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  transition: border-color .2s ease, background .2s ease;
}
.info-card:hover {
  border-color: rgba(255,159,0,.28);
  background: rgba(22, 26, 32, .85);
}

.info-icon {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
}
.info-icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.info-icon.email { color: var(--blue); background: rgba(77,163,255,.12); border-color: rgba(77,163,255,.22); }
.info-icon.location { color: var(--amber); background: rgba(255,159,0,.12); border-color: rgba(255,159,0,.22); }
.info-icon.timezone { color: #c8ccd4; background: rgba(200,204,212,.08); border-color: rgba(255,255,255,.1); }

.info-meta { min-width: 0; }
.info-meta .label {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 1.2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.info-meta .value {
  font-size: 13px;
  font-weight: 550;
  color: #e8e9eb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.info-card a.value:hover { color: var(--amber-bright); }

/* =========================================================
   SOCIAL ROW
========================================================= */
.social-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.social-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(16, 18, 22, .65);
  display: grid;
  place-items: center;
  color: #c8ccd4;
  transition: color .2s ease, border-color .2s ease, background .2s ease, transform .15s ease;
  backdrop-filter: blur(8px);
}
.social-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}
.social-btn.stroke-icon svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.social-btn:hover {
  color: var(--amber);
  border-color: rgba(255,159,0,.45);
  background: rgba(255,159,0,.08);
  transform: translateY(-2px);
}

/* =========================================================
   FORM CARD
========================================================= */
.form-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 28px 24px;
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.form-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 650;
  color: #f2f2f0;
  margin-bottom: 8px;
}
.form-title .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 10px rgba(255,159,0,.85);
}

.form-helper {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 22px;
}

.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 1px;
  color: #b8bcc4;
  margin-bottom: 7px;
}
.field label .req { color: var(--amber); }

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-wrap .field-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted-2);
  pointer-events: none;
  z-index: 1;
}
.input-wrap.textarea-wrap .field-icon {
  top: 14px;
  transform: none;
}
.input-wrap .field-icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.field input,
.field textarea {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  padding: 12px 14px 12px 40px;
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease;
  resize: vertical;
}
.field textarea {
  min-height: 110px;
  line-height: 1.5;
  padding-top: 12px;
}
.field input::placeholder,
.field textarea::placeholder { color: #5a606a; }
.field input:focus,
.field textarea:focus {
  border-color: rgba(255,159,0,.55);
  box-shadow: 0 0 0 3px rgba(255,159,0,.12);
}
.field.invalid input,
.field.invalid textarea {
  border-color: rgba(255,90,90,.55);
  box-shadow: 0 0 0 3px rgba(255,90,90,.1);
}

.btn-send {
  width: 100%;
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border: none;
  border-radius: 11px;
  background: var(--amber);
  color: #111;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .2px;
  cursor: pointer;
  transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  box-shadow: 0 8px 28px rgba(255,159,0,.28);
}
.btn-send:hover {
  background: var(--amber-bright);
  transform: translateY(-1px);
  box-shadow: 0 10px 32px rgba(255,159,0,.38);
}
.btn-send:active { transform: translateY(0); }

.or-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 18px 0 14px;
  color: var(--muted-2);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 2px;
}
.or-divider::before,
.or-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.08);
}

.alt-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.alt-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(12, 14, 18, .55);
  color: #d4d6db;
  font-size: 13.5px;
  font-weight: 550;
  transition: border-color .2s ease, color .2s ease, background .2s ease;
}
.alt-btn:hover {
  border-color: rgba(255,159,0,.4);
  color: var(--amber-bright);
  background: rgba(255,159,0,.06);
}
.alt-btn .alt-left {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.alt-btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.alt-btn .fill-icon { fill: currentColor; }
.alt-btn .stroke-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.alt-btn .arrow { color: var(--muted); font-size: 14px; }

.form-status {
  margin-top: 10px;
  font-size: 12.5px;
  min-height: 18px;
  color: var(--muted);
}
.form-status.error { color: #ff7a7a; }
.form-status.ok { color: var(--green); }

footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 8px 20px 16px;
  color: var(--muted-2);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 980px) {
  .contact-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .info-grid { max-width: none; }
}

@media (max-width: 720px) {
  .navbar { padding: 0 16px; height: 52px; }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 10px; padding: 16px 2px 12px; }
  main { padding: 16px 16px 24px; }
  .info-grid { grid-template-columns: 1fr; }
  .form-card { padding: 22px 18px 20px; }
  .left-col h1 { font-size: 30px; }
}

@media (max-width: 420px) {
  .info-meta .value { white-space: normal; }
}
</style>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="index.html" id="brandLogo">Arjun <span class="slash">//</span></a>
  <ul class="nav-links">
    <li><a href="index.html#work">WORK</a></li>
    <li><a href="about.html">ABOUT</a></li>
    <li><a href="projects.html">PROJECTS</a></li>
    <li><a href="contact.html" class="active">CONTACT</a></li>
  </ul>
</nav>

<main>
  <div class="contact-grid">
    <!-- ========== LEFT ========== -->
    <section class="left-col" aria-label="Contact info">
      <div class="section-tag" id="contactTag">04. CONTACT</div>
      <h1 id="contactHeadline">Let's Build Something <span class="accent">Amazing.</span></h1>
      <p class="bio" id="contactBio"></p>

      <div class="info-grid" id="infoGrid">
        <div class="info-card">
          <div class="info-icon email" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Email</div>
            <a class="value" id="infoEmail" href="#"></a>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon location" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-5.33-7-11a7 7 0 1 1 14 0c0 5.67-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Location</div>
            <div class="value" id="infoLocation"></div>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon timezone" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <div class="info-meta">
            <div class="label">Timezone</div>
            <div class="value" id="infoTimezone"></div>
          </div>
        </div>
      </div>

      <div class="social-row" id="socialRow" aria-label="Social links">
        <a class="social-btn" id="socialGithub" href="#" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a class="social-btn" id="socialLinkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zM8.5 8.5h3.8v2h.05c.53-1 1.82-2.05 3.75-2.05 4.01 0 4.75 2.64 4.75 6.07V23h-4v-6.6c0-1.57-.03-3.59-2.19-3.59-2.19 0-2.53 1.71-2.53 3.48V23h-4V8.5z"/></svg>
        </a>
        <a class="social-btn" id="socialTwitter" href="#" target="_blank" rel="noopener" aria-label="X / Twitter" title="X / Twitter">
          <svg viewBox="0 0 24 24"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.563l-5.14-6.71L5.25 22H2l8.03-9.17L1.5 2h6.72l4.64 6.15L18.244 2zm-1.15 18h1.82L7.01 3.9H5.06L17.094 20z"/></svg>
        </a>
        <a class="social-btn stroke-icon" id="socialEmail" href="#" aria-label="Email" title="Email">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        </a>
      </div>
    </section>

    <!-- ========== RIGHT — FORM ========== -->
    <aside class="form-card" aria-label="Send a message">
      <div class="form-title"><span class="dot" aria-hidden="true"></span><span id="formTitle">Send a Message</span></div>
      <p class="form-helper" id="formHelper"></p>

      <form id="contactForm" novalidate>
        <div class="field" id="fieldName">
          <label for="name">Name <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg></span>
            <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
          </div>
        </div>
        <div class="field" id="fieldEmail">
          <label for="email">Email <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg></span>
            <input type="email" id="email" name="email" placeholder="your.email@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="field" id="fieldSubject">
          <label for="subject">Subject <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></span>
            <input type="text" id="subject" name="subject" placeholder="Project discussion, Job opportunity, etc." required>
          </div>
        </div>
        <div class="field" id="fieldMessage">
          <label for="message">Message <span class="req">*</span></label>
          <div class="input-wrap textarea-wrap">
            <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
          </div>
        </div>

        <button type="submit" class="btn-send" id="sendBtn">Send Message →</button>
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      </form>

      <div class="or-divider">OR</div>

      <div class="alt-actions">
        <a class="alt-btn" id="altGithub" href="#" target="_blank" rel="noopener">
          <span class="alt-left">

<footer id="footerText">Arjun // CONTACT</footer>

<script>
/* =========================================================
   CONTACT CONFIG — edit this block only
========================================================= */
const CONTACT = {
  brand: "Arjun",
  pageTitle: "Arjun Soundarajan — Contact",

  tag: "04. CONTACT",
  headlineBefore: "Let's Build Something ",
  headlineAccent: "Amazing.",
  bio:
    "I'm always open to discussing new projects, creative ideas, or opportunities to be part of your vision. Whether you have a question or just want to say hi, feel free to reach out — I'll do my best to get back to you!",

  email: "soundarajan.arjun@gmail.com",
  location: "Bengaluru, India",
  timezone: "IST (UTC +5:30)",

  formTitle: "Send a Message",
  formHelper:
    "Have a project in mind, a job opportunity or just want to say hi? Fill out the form and I'll get back to you soon.",

  socials: {
    github: "https://github.com/312arjun",
    linkedin: "#",
    twitter: "#",
  },

  mailtoSubjectPrefix: "",
};

/* =========================================================
   RENDER + FORM (mailto)
========================================================= */
document.title = CONTACT.pageTitle || "Arjun Soundarajan — Contact";

const setText = (id, value) => {
  const el = document.getElementById(id);
  if (el && value != null) el.textContent = value;
};

setText("contactTag", CONTACT.tag);
document.getElementById("contactHeadline").innerHTML =
  `${CONTACT.headlineBefore || ""}<span class="accent">${CONTACT.headlineAccent || ""}</span>`;
setText("contactBio", CONTACT.bio);
setText("formTitle", CONTACT.formTitle);
setText("formHelper", CONTACT.formHelper);
setText("infoLocation", CONTACT.location);
setText("infoTimezone", CONTACT.timezone);
setText("footerText", `${CONTACT.brand || "Arjun"} // CONTACT`);

const emailEl = document.getElementById("infoEmail");
emailEl.textContent = CONTACT.email;
emailEl.href = `mailto:${CONTACT.email}`;

const gh = CONTACT.socials?.github || "#";
const li = CONTACT.socials?.linkedin || "#";
const tw = CONTACT.socials?.twitter || "#";
const mailHref = `mailto:${CONTACT.email}`;

document.getElementById("socialGithub").href = gh;
document.getElementById("socialLinkedin").href = li;
document.getElementById("socialTwitter").href = tw;
document.getElementById("socialEmail").href = mailHref;

document.getElementById("altGithub").href = gh;
document.getElementById("altLinkedin").href = li;
document.getElementById("altEmail").href = mailHref;

const form = document.getElementById("contactForm");
const statusEl = document.getElementById("formStatus");
const fields = {
  name: document.getElementById("fieldName"),
  email: document.getElementById("fieldEmail"),
  subject: document.getElementById("fieldSubject"),
  message: document.getElementById("fieldMessage"),
};

function clearInvalid() {
  Object.values(fields).forEach((f) => f.classList.remove("invalid"));
  statusEl.textContent = "";
  statusEl.className = "form-status";
}

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  clearInvalid();

  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const subject = form.subject.value.trim();
  const message = form.message.value.trim();

  let ok = true;
  if (!name) { fields.name.classList.add("invalid"); ok = false; }
  if (!email || !isValidEmail(email)) { fields.email.classList.add("invalid"); ok = false; }
  if (!subject) { fields.subject.classList.add("invalid"); ok = false; }
  if (!message) { fields.message.classList.add("invalid"); ok = false; }

  if (!ok) {
    statusEl.textContent = "Please fill in all required fields.";
    statusEl.className = "form-status error";
    return;
  }

  const prefix = CONTACT.mailtoSubjectPrefix || "";
  const mailSubject = encodeURIComponent(prefix + subject);
  const mailBody = encodeURIComponent(
    `Hi Arjun,\n\n${message}\n\n— ${name}\n${email}`
  );
  const href = `mailto:${CONTACT.email}?subject=${mailSubject}&body=${mailBody}`;

  statusEl.textContent = "Opening your email client…";
  statusEl.className = "form-status ok";
  window.location.href = href;
});

["name", "email", "subject", "message"].forEach((id) => {
  form[id].addEventListener("input", () => {
    fields[id].classList.remove("invalid");
    if (statusEl.classList.contains("error")) {
      statusEl.textContent = "";
      statusEl.className = "form-status";
    }
  });
});
</script>
</body>
</html>
